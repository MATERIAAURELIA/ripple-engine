<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flower of Life - Genesis</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0908;font-family:-apple-system,system-ui,sans-serif;color:#c9a25a}
  canvas{display:block;width:100vw;height:100vh}
  #ui{position:fixed;left:16px;bottom:16px;background:rgba(18,14,8,.65);backdrop-filter:blur(10px);
      padding:15px 18px;border-radius:14px;border:1px solid rgba(201,162,90,.25);font-size:13px;max-width:270px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
  #ui h1{font-size:11px;margin:0 0 10px;letter-spacing:2px;color:#e7c987;font-weight:700}
  .row{display:flex;align-items:center;gap:10px;margin:10px 0}
  .row label{flex:0 0 70px;opacity:.75}
  input[type=range]{flex:1;accent-color:#c9a25a}
  #ui small{opacity:.55;font-size:11px;display:block;margin:8px 0;line-height:1.4}
  .btn{background:rgba(201,162,90,.15);border:1px solid rgba(201,162,90,.4);color:#e7c987;padding:8px 12px;
       border-radius:9px;font-size:11px;font-weight:600;cursor:pointer;width:100%;transition:all 0.2s ease;text-align:center}
  .btn:hover{background:rgba(201,162,90,.3);border-color:#e7c987}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>✦ FLOWER GENESIS</h1>
  <div class="row"><label>Rings</label><input id="rings" type="range" min="1" max="4" value="2" step="1"></div>
  <div class="row"><label>Glow</label><input id="glow" type="range" min="0" max="100" value="60"></div>
  <div class="row"><label>Breath</label><input id="breath" type="range" min="0" max="100" value="50"></div>
  <div class="row"><label>Spin</label><input id="spin" type="range" min="0" max="100" value="20"></div>

  <small>19 circles on a triangular lattice — each passes through its neighbours' centres. The seed of sacred geometry.</small>

  <button id="loadBtn" class="btn" style="margin-bottom:6px">📁 Load Track File</button>
  <input id="fileInput" type="file" accept="audio/*" style="display:none">
  <div id="status" style="font-size:10px; opacity:0.5; text-align:center; margin-bottom:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">No file loaded</div>

  <div class="row"><button id="copy" class="btn" style="background:none; border:1px solid rgba(201,162,90,0.15); opacity:0.5">⧉ Copy Code</button></div>
</div>

<audio id="audioTrack" loop></audio>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const ringsEl=document.getElementById('rings'), glowEl=document.getElementById('glow'),
      breathEl=document.getElementById('breath'), spinEl=document.getElementById('spin');
const loadBtn=document.getElementById('loadBtn'), fileInput=document.getElementById('fileInput'),
      audioTrack=document.getElementById('audioTrack'), statusEl=document.getElementById('status');

let dpr=Math.min(devicePixelRatio||1,2);
function resize(){ dpr=Math.min(devicePixelRatio||1,2); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; }
addEventListener('resize',resize); resize();

document.getElementById('copy').onclick=()=>{const src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;navigator.clipboard.writeText(src).then(()=>{const b=document.getElementById('copy'),o=b.textContent;b.textContent='✓ Copied';setTimeout(()=>b.textContent=o,1500);});};

// Web Audio API Routing Nodes
let audioCtx, analyser, dataArray, sourceNode;
let smoothVolume = 0;

function initAudioEngine() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.8;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    sourceNode = audioCtx.createMediaElementSource(audioTrack);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

loadBtn.onclick = () => fileInput.click();

fileInput.onchange = () => {
  const file = fileInput.files[0];
  if (!file) return;
  initAudioEngine();

  audioTrack.src = URL.createObjectURL(file);
  statusEl.textContent = "▶ " + file.name;
  loadBtn.textContent = "⏸ Pause Track";
  audioTrack.play();
};

loadBtn.addEventListener('click', () => {
  if (audioTrack.src) {
    initAudioEngine();
    if (audioTrack.paused) {
      audioTrack.play();
      loadBtn.textContent = "⏸ Pause Track";
    } else {
      audioTrack.pause();
      loadBtn.textContent = "▶ Play Track";
    }
  }
});

function centers(r,rings){
  const pts=[], h=r*Math.sqrt(3)/2, lim=rings*r+r*0.01;
  for(let j=-rings-1;j<=rings+1;j++)
    for(let i=-rings-1;i<=rings+1;i++){
      const x=(i+j*0.5)*r, y=j*h;
      if(Math.hypot(x,y)<=lim) pts.push([x,y]);
    }
  return pts;
}

let t=0, last=performance.now();
function frame(now){
  const dt=(now-last)/1000; last=now; t+=dt;
  const W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);

  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  g.addColorStop(0,'#13100b'); g.addColorStop(1,'#0a0908');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // Poll real-time audio amplitudes if analyzer is live
  let audioImpact = 0;
  if (analyser && !audioTrack.paused) {
    analyser.getByteFrequencyData(dataArray);
    let total = 0;
    // Focus entirely on Bass and Low-Mids for rhythmic geometric expansion
    let targetRange = Math.floor(dataArray.length * 0.45);
    for (let i = 0; i < targetRange; i++) {
      total += dataArray[i];
    }
    let currentVolume = (total / targetRange) / 255.0;
    // Linear interpolation smooth dampening to eliminate jittering spikes
    smoothVolume += (currentVolume - smoothVolume) * 0.22;
    audioImpact = smoothVolume * ((+breathEl.value) / 100) * 0.45;
  } else {
    // Elegant baseline automated breathing fallback if player is empty
    audioImpact = 0.02 * Math.sin(t * 0.8) * ((+breathEl.value) / 100);
  }

  const rings=+ringsEl.value;
  const base=Math.min(W,H)/( (rings+1)*2.4 );
  const breath=1 + audioImpact;
  const r=base*breath;

  ctx.save();
  ctx.translate(W/2,H/2);
  ctx.rotate(t*(+spinEl.value)/100*0.05);

  const gl=(+glowEl.value)/100;
  ctx.shadowColor='rgba(231,201,135,'+(0.5+0.5*gl)+')';
  ctx.shadowBlur=18*gl*dpr;
  ctx.lineWidth=1.4*dpr;

  const pts=centers(r,rings);
  for(const [x,y] of pts){
    ctx.beginPath();
    ctx.strokeStyle='rgba(201,162,90,'+(0.55+0.35*gl)+')';
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.stroke();
  }

  ctx.strokeStyle='rgba(231,201,135,0.7)';
  ctx.beginPath(); ctx.arc(0,0,(rings+1)*r,0,Math.PI*2); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.lineWidth=0.8*dpr; ctx.strokeStyle='rgba(201,162,90,0.4)';
  ctx.beginPath(); ctx.arc(0,0,(rings+1)*r*1.04,0,Math.PI*2); ctx.stroke();

  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
