<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacred Geometry — Mode 2</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;color:#cfe8ff}
  canvas{display:block;width:100vw;height:100vh}
  #ui{position:fixed;left:16px;bottom:16px;background:rgba(6,12,26,.5);backdrop-filter:blur(8px);
      padding:14px 16px;border-radius:14px;border:1px solid rgba(120,180,255,.22);max-width:300px;font-size:13px}
  #ui h1{font-size:12px;margin:0 0 10px;font-weight:600;letter-spacing:1px;color:#8fd0ff}
  .row{display:flex;align-items:center;gap:10px;margin:9px 0}
  .row label{flex:0 0 92px;opacity:.8}
  input[type=range]{flex:1;accent-color:#4aa3ff}
  .val{flex:0 0 32px;text-align:right;opacity:.9;font-variant-numeric:tabular-nums}
  button{cursor:pointer;border:0;color:#fff;padding:9px 12px;border-radius:10px;font-weight:600;font-size:12px;margin-top:5px}
  #audio{background:rgba(120,180,255,.16);border:1px solid rgba(120,180,255,.3);width:100%}
  #load{background:linear-gradient(90deg,#2a6fd8,#23b8c9);width:100%}
  #hideBtn{position:fixed;right:16px;bottom:16px;background:rgba(6,12,26,.55);border:1px solid rgba(120,180,255,.3);color:#8fd0ff}
  #status{opacity:.6;font-size:11px;margin-top:8px;line-height:1.4}
  #err{position:fixed;top:10px;left:10px;color:#ff8080;font-family:monospace;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="hpnav" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;gap:4px;background:rgba(14,5,26,.55);backdrop-filter:blur(8px);padding:6px;border-radius:12px;border:1px solid rgba(200,140,255,.2);font:12px -apple-system,system-ui,sans-serif"><a href="mandala-shader.html" style="color:#c9a8ff;text-decoration:none;padding:6px 12px;border-radius:8px;letter-spacing:.5px;">Heart Portal</a><a href="mandala-shader-v2.html" style="color:#c9a8ff;text-decoration:none;padding:6px 12px;border-radius:8px;letter-spacing:.5px;">Cinematic v2</a><a href="sacred-geometry.html" style="color:#fff;text-decoration:none;padding:6px 12px;border-radius:8px;letter-spacing:.5px;background:linear-gradient(90deg,#3a1c71,#c264ff);">Sacred Geometry</a></div>
<canvas id="c"></canvas>
<div id="ui">
  <h1>◇ SACRED GEOMETRY — MODE 2</h1>
  <div class="row"><label>Symmetry</label><input id="sym" type="range" min="3" max="16" value="6" step="1"><span class="val" id="symv">6</span></div>
  <div class="row"><label>Fold (IFS)</label><input id="fold" type="range" min="0" max="100" value="45"><span class="val" id="foldv">45</span></div>
  <div class="row"><label>Ring freq</label><input id="ring" type="range" min="0" max="100" value="30"><span class="val" id="ringv">30</span></div>
  <div class="row"><label>Spin</label><input id="spin" type="range" min="0" max="100" value="15"><span class="val" id="spinv">15</span></div>
  <div class="row"><label>Hue</label><input id="hue" type="range" min="0" max="360" value="0"><span class="val" id="huev">0</span></div>
  <div class="row"><label>Glow</label><input id="glow" type="range" min="0" max="100" value="40"><span class="val" id="glowv">40</span></div>
  <button id="audio">▶ Add mic</button>
  <button id="load">📁 Load a track (bass → slices, treble → spin)</button>
  <input id="file" type="file" accept="audio/*" hidden>
  <audio id="track" loop></audio>
  <div id="status">Bass adds symmetry slices · treble speeds the spin. Press H to hide panel.</div>
</div>
<button id="hideBtn">hide (H)</button>
<div id="err"></div>
<script>
const cv=document.getElementById('c'), gl=cv.getContext('webgl')||cv.getContext('experimental-webgl'), errEl=document.getElementById('err');
if(!gl) errEl.textContent='WebGL not available.';

const VERT=`attribute vec2 a_pos; void main(){ gl_Position=vec4(a_pos,0.0,1.0); }`;
const FRAG=`
precision highp float;
uniform vec2 u_res;
uniform float u_time, u_sym, u_fold, u_ring, u_spin, u_hue, u_glow;
uniform float u_level, u_treble, u_audioOn;
#define PI 3.14159265359

vec3 hueShift(vec3 col, float a){ const vec3 k=vec3(0.57735); float c=cos(a), s=sin(a);
  return col*c + cross(k,col)*s + k*dot(k,col)*(1.0-c); }
vec3 palette(float t){ t=clamp(t,0.0,1.0);
  vec3 gold=vec3(1.0,0.82,0.42), pink=vec3(1.0,0.45,0.70), mag=vec3(0.80,0.16,0.62),
       pur=vec3(0.34,0.10,0.60), ind=vec3(0.10,0.10,0.40);
  if(t<0.25) return mix(gold,pink,t/0.25);
  if(t<0.50) return mix(pink,mag,(t-0.25)/0.25);
  if(t<0.75) return mix(mag,pur,(t-0.50)/0.25);
  return mix(pur,ind,(t-0.75)/0.25);
}

void main(){
  vec2 p=(gl_FragCoord.xy-0.5*u_res)/min(u_res.x,u_res.y);
  float t=u_time;
  float r=length(p);
  float a=atan(p.y,p.x);

  // rotational symmetry — bass adds slices
  float N=u_sym + floor(u_level*6.0*u_audioOn);
  float seg=2.0*PI/N;
  float rot=t*u_spin*(1.0+u_treble*2.5*u_audioOn);   // treble speeds the spin
  a=mod(a-rot, seg); a=abs(a-seg*0.5);
  vec2 q=vec2(cos(a),sin(a))*r;

  // IFS origami folding -> interlocking lattice (Metatron feel)
  float d=1e9; float sc=1.0;
  for(int i=0;i<5;i++){
    q=abs(q)-u_fold;                                  // fold + shift
    float c=cos(0.7),s=sin(0.7);                      // rotate each iteration
    q=vec2(q.x*c-q.y*s, q.x*s+q.y*c);
    q*=1.28; sc*=1.28;
    d=min(d, abs(length(q)-0.55)/sc);                 // distance to a circle in fold-space (SDF)
  }

  // GLOW FIELDS — neon light-filament emission (reciprocal SDF glow, no hard lines)
  float glowF=(0.014 + u_glow*0.03)/(d+0.006);
  float rd=fract(r*u_ring - t*0.15);
  float rings=smoothstep(0.06,0.0,min(rd,1.0-rd));
  float inten=(glowF + rings*0.5)*smoothstep(1.4,0.05,r);

  // cinematic grading: gold heart at center → magenta/violet outward
  vec3 col=palette(clamp(r*0.95,0.0,1.0))*inten;
  col*=(0.85 + u_level*0.6*u_audioOn);                // bass breathes brightness
  col+=mix(vec3(0.05,0.02,0.12), vec3(0.0), smoothstep(0.0,1.2,r));  // dark-indigo cosmos, never pure black
  if(u_hue>0.001) col=hueShift(col,u_hue);
  col=col/(1.0+col*0.45);                             // soft cinematic highlight rolloff
  gl_FragColor=vec4(col,1.0);
}`;

function compile(ty,src){ const s=gl.createShader(ty); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) errEl.textContent+='Shader: '+gl.getShaderInfoLog(s); return s; }
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT)); gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog); gl.useProgram(prog);
const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(prog,'a_pos'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const U={}; ['u_res','u_time','u_sym','u_fold','u_ring','u_spin','u_hue','u_glow','u_level','u_treble','u_audioOn'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
function resize(){ const d=Math.min(devicePixelRatio,2); cv.width=innerWidth*d; cv.height=innerHeight*d; gl.viewport(0,0,cv.width,cv.height); }
addEventListener('resize',resize); resize();

const sym=document.getElementById('sym'),fold=document.getElementById('fold'),ring=document.getElementById('ring'),spin=document.getElementById('spin'),hue=document.getElementById('hue'),glow=document.getElementById('glow'),status=document.getElementById('status');
sym.oninput=()=>symv.textContent=sym.value; fold.oninput=()=>foldv.textContent=fold.value; ring.oninput=()=>ringv.textContent=ring.value; spin.oninput=()=>spinv.textContent=spin.value; hue.oninput=()=>huev.textContent=hue.value; glow.oninput=()=>glowv.textContent=glow.value;

let ac=null,analyser=null,freq=null,level=0,treble=0,wired=false;
function ensureCtx(){ if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); analyser=ac.createAnalyser(); analyser.fftSize=512; analyser.smoothingTimeConstant=0.85; freq=new Uint8Array(analyser.frequencyBinCount);} ac.resume&&ac.resume(); }
document.getElementById('audio').onclick=async()=>{ try{ ensureCtx(); const st=await navigator.mediaDevices.getUserMedia({audio:true}); ac.createMediaStreamSource(st).connect(analyser); status.textContent='Mic on 🎤'; }catch(e){ status.textContent='Mic blocked — pure math.'; } };
const track=document.getElementById('track'), fileInput=document.getElementById('file');
document.getElementById('load').onclick=()=>fileInput.click();
fileInput.onchange=()=>{ const f=fileInput.files[0]; if(!f)return; ensureCtx(); track.src=URL.createObjectURL(f);
  if(!wired){ const s=ac.createMediaElementSource(track); s.connect(analyser); s.connect(ac.destination); wired=true; } track.play(); status.textContent='▶ '+f.name; };
function audio(){ if(!analyser)return; analyser.getByteFrequencyData(freq); let b=0,tr=0; const n=freq.length;
  for(let i=0;i<n*0.15;i++) b+=freq[i]; for(let i=Math.floor(n*0.5);i<n;i++) tr+=freq[i];
  level+=(Math.min(1,(b/(n*0.15))/170)-level)*0.12; treble+=(Math.min(1,(tr/(n*0.5))/140)-treble)*0.12; }

const hideBtn=document.getElementById('hideBtn');
function toggle(){ const h=document.getElementById('ui').classList.toggle('hidden'); hideBtn.style.opacity=h?0.4:1; }
document.getElementById('ui').classList.add; // noop guard
const styleHidden=document.createElement('style'); styleHidden.textContent='.hidden{display:none!important}'; document.head.appendChild(styleHidden);
hideBtn.onclick=toggle; addEventListener('keydown',e=>{ if(e.key==='h'||e.key==='H') toggle(); });

let t0=performance.now();
function frame(now){ const t=(now-t0)/1000; audio();
  gl.uniform2f(U.u_res,cv.width,cv.height);
  gl.uniform1f(U.u_time,t);
  gl.uniform1f(U.u_sym,+sym.value);
  gl.uniform1f(U.u_fold,(+fold.value)/100);
  gl.uniform1f(U.u_ring,(+ring.value)/100*8.0);
  gl.uniform1f(U.u_spin,(+spin.value)/100*0.4);
  gl.uniform1f(U.u_hue,(+hue.value)/360*6.28318);
  gl.uniform1f(U.u_glow,(+glow.value)/100);
  gl.uniform1f(U.u_level,level);
  gl.uniform1f(U.u_treble,treble);
  gl.uniform1f(U.u_audioOn,analyser?1:0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
